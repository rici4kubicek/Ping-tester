<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ping Tester</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
  <h1>Ping Tester</h1>

  <form id="range-form" class="panel">
    <div class="field-group">
      <label>Od (MAC oktety)
        <input type="text" id="start_mac" placeholder="AA:BB" required>
      </label>
      <label>Do (MAC oktety)
        <input type="text" id="end_mac" placeholder="AC:10" required>
      </label>
      <label>Timeout (s)
        <input type="number" id="timeout" value="1" min="0.1" max="10" step="0.1">
      </label>
    </div>
    <div class="actions">
      <button type="submit" id="start-btn">Start</button>
      <button type="button" id="stop-btn" disabled>Stop</button>
    </div>
    <p id="error-message" class="error"></p>
  </form>

  <div class="panel summary">
    <div><span class="label">Celkový počet pingů</span><span id="total-pings">0</span></div>
    <div><span class="label">Uběhlý čas</span><span id="elapsed-time">00:00</span></div>
    <div><span class="label">Online zařízení</span><span id="online-count">0 / 0</span></div>
  </div>

  <table class="panel devices-table">
    <thead>
      <tr>
        <th>IP adresa</th>
        <th>Stav</th>
        <th>Průměrný čas (ms)</th>
        <th>Poslední čas (ms)</th>
        <th>Úspěšné / Celkem</th>
      </tr>
    </thead>
    <tbody id="devices-body"></tbody>
  </table>
</div>

<script src="{{ url_for('static', filename='socket.io.min.js') }}"></script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
